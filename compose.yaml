services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gocart_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "09876"
    volumes:
      - gocart_api_db:/var/lib/postgresql/data
      - ./internal/infrastructure/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gocart_api"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_PORT: "3000"
      DATABASE_URL: postgres://postgres:09876@db:5432/gocart_api?sslmode=disable
      JWT_SECRET_KEY: $JWT_SECRET_KEY
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      REFRESH_TOKEN_HOURS: ${REFRESH_TOKEN_HOURS:-168}
      CURRENCY: ${CURRENCY:-BDT}
      SHIPPING_FEE_MINOR: ${SHIPPING_FEE_MINOR:-6000}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-goCart_admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-this-admin-password}
    ports:
      - "3000:3000"
volumes:
  gocart_api_db:
